name: Check
on:
  push:
    branches: [mamahjong-base, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run checks
        run: |
          mkdir -p /tmp/report
          npm run generate-i18n
          set +e
          npx tsc --noEmit > /tmp/report/typecheck.txt 2>&1; echo $? > /tmp/report/typecheck.code
          npx next lint > /tmp/report/lint.txt 2>&1; echo $? > /tmp/report/lint.code
          npm run build > /tmp/report/build.txt 2>&1; echo $? > /tmp/report/build.code
          echo "$GITHUB_SHA" > /tmp/report/sha.txt
          exit 0
      - name: Screenshots of the built app
        continue-on-error: true
        run: |
          test "$(cat /tmp/report/build.code)" = "0" || exit 0
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 3000 --directory out > /tmp/report/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          node .github/screenshots.mjs > /tmp/report/screenshots.txt 2>&1
      - name: Publish report to ci-report branch
        run: |
          cd /tmp/report
          git init -q -b ci-report
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "report for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-report
      - name: Fail if typecheck or build failed
        run: |
          test "$(cat /tmp/report/typecheck.code)" = "0"
          test "$(cat /tmp/report/build.code)" = "0"
